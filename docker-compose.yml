version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: debate-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: debate_arena
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debate-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - SECRET_KEY=devil_advocate_production_super_secret_jwt_key_88291
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=debate_arena
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: debate-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
